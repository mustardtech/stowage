{{- if .Values.stowage.enabled -}}
{{- if not .Values.split.enabled -}}
# Single mode: one Pod runs every role. SQLite on a RWO volume (or
# Postgres) plus in-process limiters, so exactly one replica, Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stowage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stowage.dashboardLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stowage.dashboardSelector" . | nindent 6 }}
  template:
    {{- include "stowage.podTemplate" (dict "root" $ "role" "all" "component" "dashboard" "resources" .Values.resources) | nindent 4 }}
{{- else -}}
{{- if ne .Values.db.driver "postgres" }}
{{- fail "split.enabled requires db.driver: postgres (SQLite cannot be shared between processes)" }}
{{- end }}
# Split mode: three Deployments share the Postgres store.
# "stowage" keeps the dashboard selector so the upgrade from single mode
# never replaces it; the proxy scales out; the operator pair is leader-elected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stowage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stowage.dashboardLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.split.dashboard.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "stowage.dashboardSelector" . | nindent 6 }}
  template:
    {{- include "stowage.podTemplate" (dict "root" $ "role" "dashboard" "component" "dashboard" "resources" .Values.resources) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stowage-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stowage.componentLabels" (dict "root" $ "component" "proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.split.proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "stowage.componentSelector" (dict "component" "proxy") | nindent 6 }}
  template:
    {{- include "stowage.podTemplate" (dict "root" $ "role" "proxy" "component" "proxy" "resources" (default .Values.resources .Values.split.proxy.resources)) | nindent 4 }}
{{- if .Values.operator.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stowage-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stowage.componentLabels" (dict "root" $ "component" "operator") | nindent 4 }}
spec:
  replicas: {{ .Values.split.operator.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "stowage.componentSelector" (dict "component" "operator") | nindent 6 }}
  template:
    {{- include "stowage.podTemplate" (dict "root" $ "role" "operator" "component" "operator" "resources" (default .Values.resources .Values.split.operator.resources)) | nindent 4 }}
{{- end }}
---
# Keep at least one proxy up through node drains and rollouts.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stowage-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stowage.componentLabels" (dict "root" $ "component" "proxy") | nindent 4 }}
spec:
  minAvailable: {{ .Values.split.proxy.minAvailable }}
  selector:
    matchLabels:
      {{- include "stowage.componentSelector" (dict "component" "proxy") | nindent 6 }}
{{- end }}
{{- end }}
